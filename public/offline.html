<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sem conexão · Futebas</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f0d;
            color: #e6ece9;
            font-family: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            padding: 2rem;
        }
        .card { max-width: 22rem; }
        img { width: 96px; height: 96px; border-radius: 1.25rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.375rem; font-weight: 800; margin: 0 0 .5rem; }
        p { color: #93a29b; line-height: 1.6; margin: 0 0 1.5rem; }
        button {
            border: 0;
            border-radius: .75rem;
            padding: .75rem 1.5rem;
            font-weight: 700;
            font-size: .8125rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #fff;
            background: #059669;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/icons/icon-192.png" alt="Futebas">
        <h1>Você está sem conexão</h1>
        <p>Não conseguimos carregar esta página. Assim que a internet voltar, é só tentar de novo.</p>
        <button type="button" onclick="location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
