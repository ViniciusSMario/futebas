# Worker da fila em supervisor — a alternativa ao systemd, e o que
# hospedagem gerenciada (Forge, Ploi, cPanel com supervisor) costuma usar.
#
#   sudo cp deploy/supervisor/futebas-queue.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread && sudo supervisorctl update
#   sudo supervisorctl status futebas-queue:*
#
# O agendador não entra aqui: ele não é processo longo, é uma chamada por
# minuto. Ver a linha de cron em docs/deploy.md.

[program:futebas-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/futebas/artisan queue:work --sleep=3 --tries=3 --backoff=60 --max-time=3600
directory=/var/www/futebas
user=www-data
autostart=true
autorestart=true

# Um worker dá conta: a fila deste app são notificações, não processamento
# pesado. Subir para 2 ou 3 se `app:health` começar a acusar atraso.
numprocs=1

stopasgroup=true
killasgroup=true

# Espera o trabalho em andamento terminar antes de matar o processo. Matar
# no meio de um envio é a forma mais fácil de duplicar uma notificação.
stopwaitsecs=120

redirect_stderr=true
stdout_logfile=/var/log/futebas/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
